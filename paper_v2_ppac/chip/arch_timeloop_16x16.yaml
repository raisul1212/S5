# =====================================================================
# Mambino paper v2 chip architecture - Timeloop v0.4 nodes/Container schema
# Generated by build_chip_specs.py - do NOT hand-edit; edit CHIP_PARAMS.
# =====================================================================
architecture:
  version: 0.4
  nodes:
    - !Container
      name: system
      attributes:
        technology: "22nm"

    - !Component
      name: weight_sram
      class: smartbuffer_SRAM
      attributes:
        depth: 32768
        width: 64
        n_banks: 8
        datawidth: 8
        read_bandwidth: 16
        write_bandwidth: 16
      constraints:
        dataspace: {keep: [A], bypass: [B, Z]}

    - !Component
      name: activation_sram
      class: smartbuffer_SRAM
      attributes:
        depth: 16384
        width: 64
        n_banks: 8
        datawidth: 8
        read_bandwidth: 16
        write_bandwidth: 16
      constraints:
        dataspace: {keep: [B, Z], bypass: [A]}

    - !Container
      name: PE_column
      spatial: {meshX: 16}
      constraints:
        spatial:
          permutation: [K, M, N]
          factors: [K=1, M=1]
          split: 999

    - !Container
      name: PE
      spatial: {meshY: 16}
      constraints:
        spatial:
          split: 0
          permutation: [K, N, M]
          factors: [K=1, N=1]

    - !Parallel
      nodes:
      - !Component
        name: weights_spad
        class: smartbuffer_RF
        attributes:
          depth: 1
          width: 8
          datawidth: 8
          read_bandwidth: 2
          write_bandwidth: 2
        constraints:
          dataspace: {keep: [A]}
          temporal:
            permutation: [M, N, K]
            factors: [M=1, N=1]

      - !Component
        name: psum_spad
        class: smartbuffer_RF
        attributes:
          depth: 1
          width: 32
          datawidth: 32
          update_fifo_depth: 2
          read_bandwidth: 2
          write_bandwidth: 2
        constraints:
          dataspace: {keep: [Z]}
          temporal:
            permutation: [K, M, N]
            factors: [M=1, N=1, K=1]

    - !Component
      name: mac
      class: intmac
      attributes:
        multiplier_width: 8
        adder_width: 32
