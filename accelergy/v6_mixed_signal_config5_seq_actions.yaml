# Mixed-signal PIM action counts -- Config 5 Pure S5 gelu 106K
# UNIFIED BASIS: MACs = 340,788,480  (dot_general / 2)
# Tile activations = ceil(340,788,480 / 16,384) = 20,800
action_counts:
  version: 0.4
  local:
    - name: chip.pim_row_drivers
      action_counts:
        - name: read
          counts: 2662400         # 20,800 tiles * 128 rows
        - name: write
          counts: 105738
    - name: chip.pim_col_drivers
      action_counts:
        - name: read
          counts: 2662400
        - name: write
          counts: 105738
    - name: chip.pim_cells
      action_counts:
        - name: read
          counts: 340788480
        - name: write
          counts: 105738
    - name: chip.pim_adc
      action_counts:
        - name: read
          counts: 2662400
    - name: chip.activation_sram
      action_counts:
        - name: read
          counts: 2662400
        - name: write
          counts: 32784
    - name: chip.state_sram
      action_counts:
        - name: read
          counts: 16384        # streaming: L * n_layers = 2048 * 8 buffered-direction reads
        - name: write
          counts: 16384        # streaming: L * n_layers = 2048 * 8 buffered-direction writes
    - name: chip.acc_adder
      action_counts:
        - name: mac_random
          counts: 2662400
    - name: chip.reg_accum
      action_counts:
        - name: read
          counts: 340788480
        - name: write
          counts: 340788480
