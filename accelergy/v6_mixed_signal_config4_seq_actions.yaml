# Mixed-signal PIM action counts -- Config 4 Mambino gelu 106K
# UNIFIED BASIS: MACs = 307,234,048  (dot_general / 2)
# Tile activations = ceil(307,234,048 / 16,384) = 18,752
action_counts:
  version: 0.4
  local:
    - name: chip.pim_row_drivers
      action_counts:
        - name: read
          counts: 2400256         # 18,752 tiles * 128 rows
        - name: write
          counts: 105738
    - name: chip.pim_col_drivers
      action_counts:
        - name: read
          counts: 2400256
        - name: write
          counts: 105738
    - name: chip.pim_cells
      action_counts:
        - name: read
          counts: 307234048
        - name: write
          counts: 105738
    - name: chip.pim_adc
      action_counts:
        - name: read
          counts: 2400256
    - name: chip.activation_sram
      action_counts:
        - name: read
          counts: 2400256
        - name: write
          counts: 32784
    - name: chip.state_sram
      action_counts:
        - name: read
          counts: 16384        # streaming: L * n_layers = 2048 * 8 buffered-direction reads
        - name: write
          counts: 16384        # streaming: L * n_layers = 2048 * 8 buffered-direction writes
    - name: chip.acc_adder
      action_counts:
        - name: mac_random
          counts: 2400256
    - name: chip.reg_accum
      action_counts:
        - name: read
          counts: 307234048
        - name: write
          counts: 307234048
