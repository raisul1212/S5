# Digital chip architecture -- Corner 3' (Mambino, half_glu2, glu_rank=40, ssm_size_base=16, bidir, batchnorm)
# JAXPR: 1,030,222,428 FLOPs, dot_general 950,012,416 -> MACs = 475,006,208
# Params: 188,682 (SLURM job 11181831, JobName chip-mamb-iso) -- iso to Corner 1
architecture:
  version: 0.4
  subtree:
    - name: chip
      attributes:
        technology: 22
        global_cycle_seconds: 1.0e-9
      local:
        - name: weight_sram
          class: SRAM
          attributes:
            technology: 22
            global_cycle_seconds: 1.0e-9
            width: 1024
            depth: 1474          # 188,682 params / 128
        - name: activation_sram
          class: SRAM
          attributes:
            technology: 22
            global_cycle_seconds: 1.0e-9
            width: 1024
            depth: 32784
        - name: state_sram
          class: SRAM
          attributes:
            technology: 22
            global_cycle_seconds: 1.0e-9
            width: 256           # same ssm_size_base=16 as Corner 1
            depth: 32768
        - name: mac_array
          class: intadder
          attributes:
            technology: 22
            global_cycle_seconds: 1.0e-9
            n_bits: 8
        - name: reg_accum
          class: flip_flop
          attributes:
            technology: 22
            global_cycle_seconds: 1.0e-9
            n_bits: 32
