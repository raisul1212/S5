# Digital chip architecture -- Corner 1 (Pure S5, half_glu2, ssm_size_base=16, bidir, batchnorm)
# JAXPR: 948,670,108 FLOPs, dot_general 882,903,552 -> MACs = 441,451,776
# Params: 188,490 (SLURM job 11187391, JobName corner1)
architecture:
  version: 0.4
  subtree:
    - name: chip
      attributes:
        technology: 22
        global_cycle_seconds: 1.0e-9
      local:
        - name: weight_sram
          class: SRAM
          attributes:
            technology: 22
            global_cycle_seconds: 1.0e-9
            width: 1024
            depth: 1473          # 188,490 params / 128
        - name: activation_sram
          class: SRAM
          attributes:
            technology: 22
            global_cycle_seconds: 1.0e-9
            width: 1024
            depth: 32784         # 4.2MB / 128
        - name: state_sram
          class: SRAM
          attributes:
            technology: 22
            global_cycle_seconds: 1.0e-9
            width: 256           # ssm_size_base=16 complex = 32 bytes = 256 bits
            depth: 32768         # 1.05MB / 32
        - name: mac_array
          class: intadder
          attributes:
            technology: 22
            global_cycle_seconds: 1.0e-9
            n_bits: 8
        - name: reg_accum
          class: flip_flop
          attributes:
            technology: 22
            global_cycle_seconds: 1.0e-9
            n_bits: 32
