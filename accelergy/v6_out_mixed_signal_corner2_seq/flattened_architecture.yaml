architecture:
    version: '0.4'
    local:
      - name: chip.pim_row_drivers
        class: array_row_drivers
        attributes:
            technology: 22
            global_cycle_seconds: 1e-09
            rows: 128
            cols: 128
            cols_active_at_once: 128
            cell_config: 'nvmexplorer_RRAM'
            average_input_value: 0.5
            average_cell_value: 0.5
            action_latency_cycles: 1
            cycle_seconds: 1e-09
            n_instances: 1
        area_scale: 1.0
        energy_scale: 1.0
      - name: chip.pim_col_drivers
        class: array_col_drivers
        attributes:
            technology: 22
            global_cycle_seconds: 1e-09
            rows: 128
            cols: 128
            cols_active_at_once: 128
            cell_config: 'nvmexplorer_RRAM'
            average_input_value: 0.5
            average_cell_value: 0.5
            action_latency_cycles: 1
            cycle_seconds: 1e-09
            n_instances: 1
        area_scale: 1.0
        energy_scale: 1.0
      - name: chip.pim_cells
        class: memory_cell
        attributes:
            technology: 22
            global_cycle_seconds: 1e-09
            rows: 128
            cols: 128
            cols_active_at_once: 128
            cell_config: 'nvmexplorer_RRAM'
            average_input_value: 0.5
            average_cell_value: 0.5
            action_latency_cycles: 1
            cycle_seconds: 1e-09
            n_instances: 1
        area_scale: 1.0
        energy_scale: 1.0
      - name: chip.pim_adc
        class: array_adc
        attributes:
            technology: 22
            global_cycle_seconds: 1e-09
            rows: 128
            cols: 128
            cols_active_at_once: 128
            cell_config: 'nvmexplorer_RRAM'
            average_input_value: 0.5
            average_cell_value: 0.5
            adc_resolution: 8
            action_latency_cycles: 1
            cycle_seconds: 1e-09
            n_instances: 1
        area_scale: 1.0
        energy_scale: 1.0
      - name: chip.activation_sram
        class: SRAM
        attributes:
            technology: 22
            global_cycle_seconds: 1e-09
            width: 1024
            depth: 4096
            action_latency_cycles: 1
            cycle_seconds: 1e-09
            n_instances: 1
            n_rw_ports: 1
            n_banks: 1
        area_scale: 1.0
        energy_scale: 1.0
      - name: chip.state_sram
        class: SRAM
        attributes:
            technology: 22
            global_cycle_seconds: 1e-09
            width: 256
            depth: 2048
            action_latency_cycles: 1
            cycle_seconds: 1e-09
            n_instances: 1
            n_rw_ports: 1
            n_banks: 1
        area_scale: 1.0
        energy_scale: 1.0
      - name: chip.acc_adder
        class: intadder
        attributes:
            technology: 22
            global_cycle_seconds: 1e-09
            n_bits: 16
            action_latency_cycles: 1
            cycle_seconds: 1e-09
            n_instances: 1
        area_scale: 1.0
        energy_scale: 1.0
      - name: chip.reg_accum
        class: flip_flop
        attributes:
            technology: 22
            global_cycle_seconds: 1e-09
            n_bits: 32
            action_latency_cycles: 1
            cycle_seconds: 1e-09
            n_instances: 1
        area_scale: 1.0
        energy_scale: 1.0
