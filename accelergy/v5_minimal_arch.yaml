# Minimal Accelergy test: 3 primitive components, all via Aladdin
architecture:
  version: 0.4
  subtree:
    - name: chip
      attributes:
        technology: 22
        global_cycle_seconds: 1.0e-9
      local:
        - name: weight_sram
          class: SRAM
          attributes:
            width: 1024
            depth: 826
        - name: mac_array
          class: intmac
          attributes:
            width: 8
        - name: reg_accum
          class: regfile
          attributes:
            width: 32
            depth: 128
