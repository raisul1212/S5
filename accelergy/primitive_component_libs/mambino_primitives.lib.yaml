# Primitive component library for Mambino chip PPAC.
# Declares primitive classes so Accelergy dispatches to CACTI/NeuroSim/ADC plugins.
classes:
  # ----- CACTI-backed SRAM -----
  - name: SRAM
    attributes:
      technology: must_specify
      global_cycle_seconds: 1.0e-9
      width: must_specify
      depth: must_specify
      n_rw_ports: 1
      n_banks: 1
    actions:
      - name: read
      - name: write
      - name: leak

  # ----- NeuroSim-backed intadder used as MAC approximation (n_bits=8) -----
  - name: intadder
    attributes:
      technology: must_specify
      global_cycle_seconds: 1.0e-9
      n_bits: 8
    actions:
      - name: mac_random
      - name: add
      - name: read
      - name: leak

  # ----- NeuroSim-backed flip_flop for register file -----
  - name: flip_flop
    attributes:
      technology: must_specify
      global_cycle_seconds: 1.0e-9
      n_bits: 32
    actions:
      - name: read
      - name: write
      - name: leak

  # ----- NeuroSim mixed-signal PIM cell blocks -----
  - name: array_row_drivers
    attributes:
      technology: must_specify
      global_cycle_seconds: 1.0e-9
      rows: must_specify
      cols: must_specify
      cols_active_at_once: 1
      cell_config: must_specify
      average_input_value: 0.5
      average_cell_value: 0.5
    actions:
      - name: read
      - name: write
      - name: leak

  - name: array_col_drivers
    attributes:
      technology: must_specify
      global_cycle_seconds: 1.0e-9
      rows: must_specify
      cols: must_specify
      cols_active_at_once: 1
      cell_config: must_specify
      average_input_value: 0.5
      average_cell_value: 0.5
    actions:
      - name: read
      - name: write
      - name: leak

  - name: array_adc
    attributes:
      technology: must_specify
      global_cycle_seconds: 1.0e-9
      rows: must_specify
      cols: must_specify
      cols_active_at_once: 1
      cell_config: must_specify
      average_input_value: 0.5
      average_cell_value: 0.5
      adc_resolution: 8
    actions:
      - name: read
      - name: convert
      - name: leak

  - name: memory_cell
    attributes:
      technology: must_specify
      global_cycle_seconds: 1.0e-9
      rows: must_specify
      cols: must_specify
      cols_active_at_once: 1
      cell_config: must_specify
      average_input_value: 0.5
      average_cell_value: 0.5
    actions:
      - name: read
      - name: write
      - name: leak
