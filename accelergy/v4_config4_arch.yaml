# Digital chip architecture for Config 4 Mambino gelu 106K
# 22nm INT8, using published components (SRAM via CACTI, intmac via Aladdin)
architecture:
  version: 0.2
  subtree:
    - name: chip
      attributes:
        technology: 22nm
      local:
        - name: weight_sram
          class: SRAM
          attributes:
            word_width: 8      # INT8 datawidth
            n_words: 128       # H=128 wide accesses
            width: word_width * n_words
            depth: 826         # 105.7K params / 128 bytes per word
            nbanks: 1
        - name: activation_sram
          class: SRAM
          attributes:
            word_width: 8
            n_words: 128       # H-wide activation buffer
            width: word_width * n_words
            depth: 32784       # 4.2MB / 128 = ~33K entries
            nbanks: 1
        - name: state_sram
          class: SRAM
          attributes:
            word_width: 8
            n_words: 32        # local_P = 16 complex = 32 real bytes
            width: word_width * n_words
            depth: 49152       # 1.6MB / 32 = 50K entries
            nbanks: 1
        - name: mac_array
          class: intmac
          attributes:
            datawidth: 8
        - name: reg_accum
          class: regfile
          attributes:
            width: 32          # accumulator wider than 8-bit
            depth: 128         # per H output
