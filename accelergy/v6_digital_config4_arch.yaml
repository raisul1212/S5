# Digital chip architecture -- Config 4 Mambino gelu 106K, 22nm INT8
# Primitives resolved via:
#   SRAM -> CACTI plugin (actions read/write)
#   intmac -> Aladdin plugin (action access + leak)
#   regfile -> Aladdin plugin (actions read/write)
architecture:
  version: 0.4
  subtree:
    - name: chip
      attributes:
        technology: 22
        global_cycle_seconds: 1.0e-9
      local:
        - name: weight_sram
          class: SRAM
          attributes:
            technology: 22
            global_cycle_seconds: 1.0e-9
            width: 1024        # 128 bytes * 8 bits per line
            depth: 826         # 105,738 params / 128
        - name: activation_sram
          class: SRAM
          attributes:
            technology: 22
            global_cycle_seconds: 1.0e-9
            width: 1024
            depth: 32784
        - name: state_sram
          class: SRAM
          attributes:
            technology: 22
            global_cycle_seconds: 1.0e-9
            width: 256          # local_P=16 complex = 32 bytes * 8 bits
            depth: 49152        # 1.6MB / 32
        - name: mac_array
          class: intmac
          attributes:
            technology: 22
            global_cycle_seconds: 1.0e-9
            width: 8
        - name: reg_accum
          class: regfile
          attributes:
            technology: 22
            global_cycle_seconds: 1.0e-9
            width: 32
            depth: 128
