architecture:
  version: 0.2
  subtree:
    - name: chip
      attributes:
        technology: 22nm
      local:
        - name: main_sram
          class: SRAM
          attributes:
            word_width: 8       # INT8 datawidth
            n_words: 128        # H=128 wide
            width: word_width * n_words
            depth: 44032        # bytes: 106K weights + ~4.2MB activations + 1.5MB state ~ 5.6MB total / 128 = 44K entries
            nbanks: 1
        - name: state_sram
          class: SRAM
          attributes:
            word_width: 8
            n_words: 16
            width: word_width * n_words
            depth: 100000       # holds SSM state trajectory (~1.6MB for Mambino)
            nbanks: 1
        - name: mac_array
          class: intmac
          attributes:
            datawidth: 8
        - name: reg_accum
          class: regfile
          attributes:
            width: 32           # accumulator wider than 8-bit MAC
            depth: 128          # per H output
